<html lang="en">
<head>

<title>Maitri Cafe · Orders</title>
</head>
<body>
<div id="splash" role="status" aria-label="Loading Maitri Cafe">
  <div class="sp-in">
    <svg class="sp-cup" viewBox="0 0 72 72" aria-hidden="true">
      <path class="st st1" d="M27 22c-4-4 4-7 0-12"/><path class="st st2" d="M36 22c-4-4 4-7 0-12"/><path class="st st3" d="M45 22c-4-4 4-7 0-12"/>
      <path class="cup" d="M16 30h36v12a16 16 0 0 1-16 16h-4a16 16 0 0 1-16-16z"/>
      <path class="handle" d="M52 34h4a7 7 0 0 1 0 14h-5"/>
      <path class="saucer" d="M12 62h48"/>
    </svg>
    <div class="sp-word" aria-hidden="true"><span style="--i:0">M</span><span style="--i:1">a</span><span style="--i:2">i</span><span style="--i:3">t</span><span style="--i:4">r</span><span style="--i:5">i</span></div>
    <div class="sp-cafe">CAFE</div>
    <p class="sp-tag">Good Food ~ Good Vibes ~ Always</p>
    <p class="sp-sub">Staff dashboard</p>
    <div class="sp-bar" aria-hidden="true"><i></i></div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('splash'), t0 = Date.now(), seen = false, done = false;
  try { seen = sessionStorage.getItem('mc_splash') === '1'; sessionStorage.setItem('mc_splash', '1'); } catch (e) {}
  var min = seen ? 450 : 1700; // full intro on first open (QR scan), short on reloads
  function hide() {
    if (done) return; done = true;
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650); },
      Math.max(0, min - (Date.now() - t0)));
  }
  window.MCSplash = { hide: hide };
  setTimeout(hide, 8000); // never block the page
})();
</script>
<div id="app"></div>
<script src="/vendor/qrcode.js?v=5.1"></script>
<script src="/js/motion.js?v=5.1"></script>
<script src="/js/common.js?v=5.1"></script>
<script src="/js/api.js?v=5.1"></script>
<script src="/js/admin.js?v=5.1"></script>
<script>mountAdmin(document.getElementById('app'));</script>
</body>
</html>
